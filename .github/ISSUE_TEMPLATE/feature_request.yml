name: Feature request
description: Propose a new helper, notebook or theme
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What figure or workflow is hard today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or notebook outline
      render: python
  - type: textarea
    id: refs
    attributes:
      label: References
      description: Papers, style guides or examples that motivate the request.
