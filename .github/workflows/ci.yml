name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check mplmasterpro tests scripts examples generate_all_datasets.py streamlit_app.py
      - run: ruff format --check mplmasterpro tests

  test:
    name: Tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Run test suite with coverage
        run: python -m pytest --cov=mplmasterpro --cov-report=xml --cov-report=term
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  notebooks:
    name: Execute notebooks
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg (animation exports)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install package with notebook and dev extras
        run: python -m pip install -e ".[dev,notebooks]"
      - name: Execute every notebook headlessly
        run: python scripts/run_notebooks.py --timeout 600
      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: build/notebooks/*.ipynb
          if-no-files-found: ignore

  scripts:
    name: Run production scripts and examples
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m pip install -e ".[dev,notebooks]"
      - name: Datasets regenerate byte-for-byte
        run: |
          python generate_all_datasets.py --out build/datasets --quiet
          for f in datasets/*.csv; do cmp "$f" "build/datasets/$(basename "$f")"; done
      - name: Scripts
        run: |
          for f in scripts/generate_dashboard.py scripts/generate_3d_plots.py scripts/generate_statistical_plots.py scripts/batch_export.py scripts/create_publication_figures.py; do
            echo "::group::$f"; python "$f"; echo "::endgroup::"
          done
      - name: Examples
        run: |
          for f in examples/*.py; do echo "::group::$f"; python "$f"; echo "::endgroup::"; done

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: matplotlibmasterpro:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
